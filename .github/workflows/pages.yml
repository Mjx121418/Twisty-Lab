name: Deploy GitHub Pages

# Pushing code and publishing the site are separate, user-controlled actions.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read
    env:
      EMSDK_VERSION: '6.0.11'
      EMCC_CORES: '2'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.21.0'
          cache: npm

      - name: Read Pages settings
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build python3

      - name: Install Emscripten
        shell: bash
        run: |
          sdk_dir="$RUNNER_TEMP/emsdk"
          git clone --depth 1 --branch "$EMSDK_VERSION" https://github.com/emscripten-core/emsdk.git "$sdk_dir"
          "$sdk_dir/emsdk" install "$EMSDK_VERSION"
          "$sdk_dir/emsdk" activate "$EMSDK_VERSION"
          printf 'EMSDK=%s\nEM_CONFIG=%s/.emscripten\nEM_CACHE=%s/upstream/emscripten/cache\n' "$sdk_dir" "$sdk_dir" "$sdk_dir" >> "$GITHUB_ENV"
          printf '%s/upstream/emscripten\n' "$sdk_dir" >> "$GITHUB_PATH"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build and verify native and WASM code
        env:
          SITE_BASE_PATH: '${{ steps.pages.outputs.base_path }}/'
        run: |
          npm run build
          npm run test:native
          npm run test:unit

      - name: Install browser for smoke tests
        run: npx playwright install --with-deps chromium

      - name: Verify the published paths in Chromium
        env:
          SITE_BASE_PATH: '${{ steps.pages.outputs.base_path }}/'
        run: npm run test:e2e

      - name: Upload static site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
